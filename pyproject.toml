[project]
name = "research-agent"
version = "1.3.1"
description = "Deep Research 智能研究 Agent（FastAPI + LangGraph + SQLite）"
requires-python = ">=3.11"

# ======================= Ruff（lint + 格式化） =======================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports", "data", "docs"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I import 排序 · B bugbear 常见陷阱 · UP pyupgrade · SIM 简化
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # 行宽不强制（保留注释可读性，超长行多为中文文档字符串）
    "B008",   # FastAPI 依赖注入惯用法：函数调用作为参数默认值
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ======================= Mypy（类型检查） =======================
[tool.mypy]
python_version = "3.11"
files = ["backend"]
# 渐进式收严：当前基线为「新代码必须带类型注解」，存量动态用法暂不强制
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
